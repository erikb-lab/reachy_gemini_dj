[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "reachy_gemini_dj"
version = "0.9.0"
description = "Expressive Gemini Live Voice DJ with built-in dances, Google Workspace tools, and responsive web UI for Reachy Mini."
authors = [{ name = "sillymastermind" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "reachy-mini>=0.1.0",
    "google-genai>=0.1.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "pydantic>=2.0.0",
    "yt-dlp>=2024.0.0",
    "numpy",
    "websockets>=12.0",
    "zxing-cpp>=2.0",
]

[project.optional-dependencies]
# Install on the laptop / Mac mini that runs the local "brain" (not on the robot):  pip install ".[brain]"
brain = [
    "websockets>=12.0",
    "httpx>=0.25",
    "numpy",
    "faster-whisper>=1.0",
    "pocket-tts",
    "webrtcvad-wheels",
    "ddgs",
    "google-genai>=0.1.0",
]
test = ["pytest"]

[project.scripts]
reachy-brain = "reachy_brain.server:main"

[project.entry-points."reachy_mini_apps"]
reachy_gemini_dj = "reachy_gemini_dj.main:ReachyGeminiDJ"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["reachy_gemini_dj*", "reachy_brain*"]

[tool.setuptools.package-data]
reachy_gemini_dj = [
    "static/**/*",
    "static/*",
]
